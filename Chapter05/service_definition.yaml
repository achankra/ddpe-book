# service_definition.yaml 
apiVersion: platform.ddpe.io/v1 
kind: ServiceOffering 
metadata: 
  name: database-provisioning 
  version: v2.0.0 
  domain: platform-core 

spec: 
  description: Self-service database provisioning for domain teams 

  supportedDatabases: 
    - engine: postgresql 
      versions: ["14", "15", "16"] 
      tiers: ["dev", "staging", "production"] 

  sla: 
    provisioning: 
      dev: 5m 
      staging: 10m 
      production: 15m 
    availability: 99.9% 

  

  selfService: 
    portal: true 
    cli: true 
    api: true 
    terraform: true 

  evolution: 
    deprecationNotice: 90d 
    supportedVersions: 2 
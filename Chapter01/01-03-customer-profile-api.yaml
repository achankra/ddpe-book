# Customer Profile API - Service Request
# This YAML defines a service provisioning request using the
# domain-driven platform's self-service interface.
#
# Rather than specifying low-level infrastructure details,
# the developer declares intent using domain concepts.

apiVersion: platform/v1
kind: ServiceRequest
metadata:
  name: customer-profile-api
  domain: customer-management
  team: customer-experience
  owner: cx-platform-team@company.com

spec:
  type: api-service
  tier: production

  # Domain-specific configuration
  domain_context:
    bounded_context: customer-management
    data_classification: pii
    compliance:
      - gdpr
      - ccpa

  # The platform infers infrastructure from domain context
  capabilities:
    - name: data-store
      purpose: customer-records
      # Platform selects PostgreSQL with encryption based on PII classification

    - name: cache
      purpose: session-management
      ttl: 3600

    - name: event-stream
      purpose: customer-events
      # Platform provisions Kafka topic with appropriate retention

  # Observability is automatic based on domain context
  observability:
    dashboards:
      - customer-api-health
      - customer-data-access-audit
    alerts:
      - type: latency
        threshold_ms: 200
        severity: critical
      - type: error_rate
        threshold_percent: 1.0
        severity: warning

  # Golden path deployment configuration
  deployment:
    strategy: blue-green
    regions:
      - us-east-1
      - eu-west-1
    scaling:
      min_replicas: 3
      max_replicas: 20
      target_cpu_percent: 70
